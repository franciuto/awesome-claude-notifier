name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners would check out CRLF and fail the gofmt check
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  dispatcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-dispatcher.sh

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -typecheck macos-helper/main.swift

  # The Release workflow bumps the version and builds bin/ and macos/ in one commit.
  # A pull request that does either itself would split them again.
  release-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          if git diff --name-only "$BASE" HEAD -- 'bin/*/*' macos | grep .; then
            echo "::error::Leave bin/ and macos/ out of the pull request; the Release workflow builds them."
            fail=1
          fi
          if [ "$(git show "$BASE:.claude-plugin/plugin.json" | jq -r .version)" != "$(jq -r .version .claude-plugin/plugin.json)" ]; then
            echo "::error::Leave version in .claude-plugin/plugin.json as it is; the Release workflow bumps it."
            fail=1
          fi
          exit $fail
